[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srp"
version = "0.1.0"
description = "Stock return predictor: leak-free walk-forward ML backtest with Monte Carlo evaluation"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "yfinance",
  "matplotlib",
  "pyyaml",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
